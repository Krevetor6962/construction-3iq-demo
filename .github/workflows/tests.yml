name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Create local offline configuration
        run: Copy-Item config\demo-profile.example.json config\demo-profile.json
      - name: Install public dependencies
        run: python -m pip install --index-url https://pypi.org/simple -e ".[test]"
      - name: Validate dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run all offline benchmark questions
        run: python scripts\run_benchmark.py --mode offline
      - name: Check diagram and frontend JavaScript
        run: |
          node --check apps\construction-command-center\static\app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\generate_architecture_diagrams.mjs
