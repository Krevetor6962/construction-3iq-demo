name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Create local offline configuration
        run: Copy-Item config\demo-profile.example.json config\demo-profile.json
      - name: Install public dependencies
        run: python -m pip install --index-url https://pypi.org/simple -e ".[test]"
      - name: Validate dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run all offline benchmark questions
        run: python scripts\run_benchmark.py --mode offline
      - name: Check diagram and frontend JavaScript
        run: |
          node --check apps\construction-command-center\static\app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\generate_architecture_diagrams.mjs
